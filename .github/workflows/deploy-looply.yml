name: Deploy Looply

on:
  push:
    branches: [main]
    paths:
      - "looply/**"
      - ".github/workflows/deploy-looply.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: looply/package-lock.json
      - name: Build static Looply
        working-directory: looply
        env:
          LOOPLY_EXPORT: "1"
          LOOPLY_BASE_PATH: /Ali-Slaimia
        run: npm ci && npm run build && node -e "require('fs').writeFileSync('out/.nojekyll','')"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: looply/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
